<p>这博客在一台 OPPO 手机上用 Termux 写，推到 GitHub Pages 发布。不花一分钱，也不需要服务器。</p>
<h2>怎么加文章</h2>
<p>在手机的 Termux 里运行 <code>blog-new "标题" "摘要"</code>：它会生成文章文件，并自动在首页插好链接。</p>
<p>写完正文之后运行 <code>blog-deploy</code> 发布。大约 1 分钟后线上生效。</p>
<h2>怎么加文件</h2>
<p>运行 <code>blog-addfile &lt;文件或文件夹&gt;</code>，它会复制进分享目录、刷新列表页并直接发布。</p>
